name: Android APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in android/app/build.gradle (main only, requires persistent signing)
        type: boolean
        default: false
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify APK
        shell: bash
        id: build
        env:
          PUBLISH: ${{ inputs.publish }}
          KEYSTORE_BASE64: ${{ secrets.STILL_KEYSTORE_BASE64 }}
          STILL_STORE_PASSWORD: ${{ secrets.STILL_STORE_PASSWORD }}
          CERTIFICATE_SHA256: ${{ vars.STILL_CERTIFICATE_SHA256 }}
        run: |
          set -o pipefail
          version=$(sed -n "s/^[[:space:]]*versionName '\([0-9][0-9.]*\)'.*/\1/p" android/app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          apk="Alpharail-v$version-debug.apk"
          if [[ "$PUBLISH" == true && ( "$GITHUB_REF" != refs/heads/main || -z "$KEYSTORE_BASE64" || -z "$STILL_STORE_PASSWORD" || -z "$CERTIFICATE_SHA256" ) ]]; then
            echo '::error::Publishing requires main, both release signing secrets, and the pinned certificate SHA-256.'
            exit 1
          fi
          if [[ -n "$KEYSTORE_BASE64" && -n "$STILL_STORE_PASSWORD" ]]; then
            umask 077
            export STILL_KEYSTORE="$RUNNER_TEMP/still.p12"
            trap 'rm -f "$STILL_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STILL_KEYSTORE"
            apk="Alpharail-v$version.apk"
          fi
          if ! android/scripts/package-apk.sh "$apk" 2>&1 | tee "$RUNNER_TEMP/package.log"; then
            tail -n 12 "$RUNNER_TEMP/package.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if [[ -n "${STILL_KEYSTORE:-}" && -n "$CERTIFICATE_SHA256" ]]; then
            expected=$(printf '%s' "$CERTIFICATE_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/package.log")
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$expected" != "$actual" ]]; then
              echo '::error::Release signing certificate does not match the pinned fingerprint.'
              exit 1
            fi
          fi
          printf 'apk=%s\ntag=v%s\n' "$apk" "$version" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          TAG: ${{ steps.build.outputs.tag }}
        run: gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Alpharail $TAG" --generate-notes
      - name: Publish v0.3.3 debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outputs.tag == 'v0.3.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.3.3
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          apk=Alpharail-v0.3.3-debug.apk
          android/scripts/package-apk.sh "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title 'Alpharail v0.3.3 (Debug APK)' --notes 'Still is now Alpharail, with the selected ivory, ink, and periwinkle adaptive icon. Android 8.0+. The new package ID, com.ravenmire.alpharail, installs alongside Still rather than updating it. Export settings from Still and import them into Alpharail. Set Alpharail as Home, regrant Chats access if needed, and set up App Lock and widgets again. This is a development-signed APK.'
