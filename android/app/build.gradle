plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.ravenmire.alpharail'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ravenmire.alpharail'
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName '0.3.16'
    }
    signingConfigs {
        distribution {
            if (System.getenv('STILL_KEYSTORE')) {
                storeFile file(System.getenv('STILL_KEYSTORE'))
                storePassword System.getenv('STILL_STORE_PASSWORD')
                keyAlias 'still'
                keyPassword System.getenv('STILL_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('STILL_KEYSTORE')) signingConfig signingConfigs.distribution
        }
    }
}
